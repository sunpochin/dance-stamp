# 檔案用途：PR 與 main 更新時驗證 harness，讓遠端沿用本機檢查並保留結果。
# 所在層：GitHub Actions；主要關聯：package.json、docs/ai/HARNESS.md。
name: Harness CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # 固定開發工具與完整性，禁止安裝腳本；與本機使用同一品質入口。
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      # 只驗證白名單下載包，不部署或上傳發行檔；發布仍需人工決策。
      - run: bun run package:web && bun run check:package
