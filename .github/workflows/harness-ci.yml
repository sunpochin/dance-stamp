# 檔案用途：PR 與 main 更新時驗證 harness，讓遠端沿用本機檢查並保留結果。
# 所在層：GitHub Actions；主要關聯：package.json、docs/ai/HARNESS.md。
name: Harness CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # 固定開發工具與完整性，禁止安裝腳本；與本機使用同一品質入口。
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      # 保留原單元入口與統計範圍；低覆蓋率模組仍列入報表，不用忽略規則湊數字。
      - run: bun run test:coverage
      # 只驗證白名單下載包，不部署或上傳發行檔；發布仍需人工決策。
      - run: bun run package:web && bun run check:package
  app-coverage:
    needs: harness
    runs-on: ubuntu-24.04
    # 整合71條的原輪已跑近15分鐘，尚需恢復尾段與離站播放；保留完整收尾餘裕。
    # 只調工作總預算；原五秒離線、十五秒影格守門等各案期限不變。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      # Ubuntu runner 未預裝 FFmpeg；只為生成合成素材安裝，產品包不加入編碼器。
      - name: Install synthetic fixture encoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # 沿用 runner 已安裝的瀏覽器；計數／失敗情境不能當作裝置驗收。
      - name: Measure every App module with unit and isolated browser checks
        run: |
          command -v ffmpeg
          export DANCE_STAMP_CHROMIUM="$(command -v google-chrome)"
          bun run test:coverage:app
      # 原入口已關閉網站與瀏覽器；另開原生file播放器，不能以App內預覽替代實際下載證據。
      - name: Reopen actual storage-version downloads after app shutdown
        run: bun --no-env-file tests/app-coverage/verify-storage-version-downloads.ts
      - name: Show unit diagnostics on failure
        if: failure()
        run: |
          for file in coverage/app-*/unit-errors.log; do
            if [ -f "$file" ]; then cat -- "$file"; fi
          done
  linux-install-restart:
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # 證據須綁定 PR 真正來源，不能把 GitHub 的臨時 merge commit 當受測 head。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # 控制器只放此輪暫存目錄；沿用 runner 的 Chrome，不替產品加入瀏覽器套件。
      - run: npm install --prefix "$RUNNER_TEMP/dance-stamp-linux-qa" --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
      - name: Force exit during a native partial install on Linux
        run: |
          test "$(uname -s)" = Linux
          uname -srmo
          google-chrome --version
          bun run build
          bun --no-env-file tests/browser/forced-install-restart.ts "$(command -v google-chrome)" "$RUNNER_TEMP/dance-stamp-linux-qa/node_modules/playwright-core/index.mjs"
      - name: Preserve synthetic evidence and browser errors
        if: always()
        # 失敗也保留原始收據；只列明確 QA 檔，不上傳整個 profile 或資料庫。
        run: |
          for file in output/forced-install-*/evidence.local.json output/forced-install-*/*-chromium.log; do
            if [ -f "$file" ]; then
              echo "::group::$file"
              cat -- "$file"
              echo "::endgroup::"
            fi
          done
