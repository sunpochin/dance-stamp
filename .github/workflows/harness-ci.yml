# 檔案用途：PR 與 main 更新時驗證 harness，讓遠端沿用本機檢查並保留結果。
# 所在層：GitHub Actions；主要關聯：package.json、docs/ai/HARNESS.md。
name: Harness CI
on:
  # 內建 token 建的版本 PR 不觸發 PR 事件；維護者可對該分支跑相同檢查。
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # 固定開發工具與完整性，禁止安裝腳本；與本機使用同一品質入口。
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      # 保留原單元入口與統計範圍；低覆蓋率模組仍列入報表，不用忽略規則湊數字。
      - run: bun run test:coverage
      # 只驗證白名單下載包，不部署或上傳發行檔；發布仍需人工決策。
      - run: bun run package:web && bun run check:package
  app-coverage:
    needs: harness
    runs-on: ubuntu-24.04
    # 76 案與離站重播已實測超過 20 分鐘，舊總預算會在成功收尾時取消工作。
    # 只留足整場收尾餘裕；原五秒離線、十五秒恢復及各媒體守門期限不變。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      # Ubuntu runner 未預裝 FFmpeg；只為生成合成素材安裝，產品包不加入編碼器。
      - name: Install synthetic fixture encoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # 量尺先接受正例並拒絕已知壞檔，避免產品檢查沿用錯誤的片長或舊音高假設。
      - name: Check comparison analyzer controls
        run: python3 scripts/check-comparison-analyzer.py
      # 沿用 runner 已安裝的瀏覽器；計數／失敗情境不能當作裝置驗收。
      - name: Measure every App module with unit and isolated browser checks
        run: |
          command -v ffmpeg
          export DANCE_STAMP_CHROMIUM="$(command -v google-chrome)"
          bun run test:coverage:app
      # 原入口已關閉網站與瀏覽器；另開原生file播放器，不能以App內預覽替代實際下載證據。
      - name: Reopen actual storage-version downloads after app shutdown
        run: bun --no-env-file tests/app-coverage/verify-storage-version-downloads.ts
      # 兩種 runtime 與真正回退的成品都要離站解碼／播放，不能用模型成功替成檔背書。
      - name: Reopen SIMD and compatibility follow downloads after app shutdown
        run: bun --no-env-file tests/app-coverage/verify-follow-runtime-downloads.ts
      # 先驗真正下載，再核對完整收據；局部或失敗報表不產生 badge。
      - name: Generate verified coverage badges and report
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun --no-env-file scripts/coverage-badges.ts coverage/app-* coverage/badges
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-coverage-report
          path: coverage/badges/
          if-no-files-found: error
          retention-days: 30
      - name: Show unit diagnostics on failure
        if: failure()
        run: |
          for file in coverage/app-*/unit-errors.log; do
            if [ -f "$file" ]; then cat -- "$file"; fi
          done
  linux-install-restart:
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # 證據須綁定 PR 真正來源，不能把 GitHub 的臨時 merge commit 當受測 head。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # 靜態包現在隨附固定版本機模型 runtime，乾淨 Linux checkout 也必須先取得相同依賴。
      - run: bun install --frozen-lockfile --ignore-scripts
      # 控制器只放此輪暫存目錄；沿用 runner 的 Chrome，不替產品加入瀏覽器套件。
      - run: npm install --prefix "$RUNNER_TEMP/dance-stamp-linux-qa" --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
      - name: Force exit during a native partial install on Linux
        run: |
          test "$(uname -s)" = Linux
          uname -srmo
          google-chrome --version
          bun run build
          bun --no-env-file tests/browser/forced-install-restart.ts "$(command -v google-chrome)" "$RUNNER_TEMP/dance-stamp-linux-qa/node_modules/playwright-core/index.mjs"
      - name: Preserve synthetic evidence and browser errors
        if: always()
        # 失敗也保留原始收據；只列明確 QA 檔，不上傳整個 profile 或資料庫。
        run: |
          for file in output/forced-install-*/evidence.local.json output/forced-install-*/*-chromium.log; do
            if [ -f "$file" ]; then
              echo "::group::$file"
              cat -- "$file"
              echo "::endgroup::"
            fi
          done
  coverage-badges:
    # PR 保持唯讀；三項既有檢查都成功後，才更新 main 的量測數字。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [harness, app-coverage, linux-install-restart]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: app-coverage-report
          path: verified-coverage
      - name: Update only the coverage badge branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          report="$GITHUB_WORKSPACE/verified-coverage"
          mkdir "$RUNNER_TEMP/badge-repository"
          cd "$RUNNER_TEMP/badge-repository"
          git init -b codex/coverage-badges
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config credential.helper '!gh auth git-credential'
          # 不讓較舊的成功輪覆蓋已前進的 main；只保留可追溯的最後成功輪。
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" != "$GITHUB_SHA" ]; then exit 0; fi
          previous="$(git ls-remote origin refs/heads/codex/coverage-badges)"
          if [ -n "$previous" ]; then
            git fetch --depth=1 origin refs/heads/codex/coverage-badges
            git switch -C codex/coverage-badges FETCH_HEAD
          fi
          # 只複製公開的統計與原始碼報表，不上傳影片、profile 或完整測試目錄。
          for file in lines.json functions.json branches.json summary.json report.html README.md; do
            cp "$report/$file" "$file"
            git add -- "$file"
          done
          git config user.name github-actions
          git config user.email github-actions@localhost
          git commit -m "chore: Update coverage for $GITHUB_SHA" -m "Generated from successful full main CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/codex/coverage-badges
