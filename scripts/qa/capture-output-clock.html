<!-- 檔案用途：一次手勢啟動的靜音輸出時計能力檢查，不接相機／麥克風。所在層：開發QA，非產品包。主要關聯：web/main.js、docs/RECORD_COMPARE.md、issue-11-explicit-pts-spike.md；相對Safari受測頁只加此檔頭。 -->
<meta charset="utf-8"><title>Dance Stamp silent output clock capability</title><h1>本機靜音輸出時計檢查</h1><p>只建立本頁靜音音訊；不使用相機、麥克風或檔案。不重試。</p><button id="start">執行一次靜音檢查</button><pre id="result">尚未執行</pre><script>
let started=false;document.querySelector('#start').onclick=async e=>{if(started)return;started=true;e.target.disabled=true;const result={scope:'native Safari silent output clock capability only; not capture/encodedAV/human acceptance',trusted:e.isTrusted,userAgent:navigator.userAgent,samples:[],errors:[],sourceStopped:false,contextClosed:false};let a,node,gain;try{a=new AudioContext();gain=a.createGain();gain.gain.value=0;node=a.createOscillator();node.connect(gain).connect(a.destination);await a.resume();node.start();for(const delay of [0,250,250]){if(delay)await new Promise(resolve=>setTimeout(resolve,delay));const before=performance.now(),currentTime=a.currentTime;let timestamp=null;if(typeof a.getOutputTimestamp==='function')timestamp=a.getOutputTimestamp();result.samples.push({before,state:a.state,currentTime,timestamp,baseLatency:a.baseLatency??null,outputLatency:a.outputLatency??null,sampleRate:a.sampleRate,after:performance.now()});}}catch(error){result.errors.push({name:error.name,message:error.message});}finally{try{if(node){node.stop();node.disconnect();result.sourceStopped=true;}gain?.disconnect();}catch(error){result.errors.push({stage:'stop',name:error.name});}try{if(a){await a.close();result.contextClosed=a.state==='closed';}}catch(error){result.errors.push({stage:'close',name:error.name});}document.querySelector('#result').textContent=JSON.stringify(result,null,2);window.outputClockCapability=result;}};</script>
