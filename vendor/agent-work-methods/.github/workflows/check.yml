# 檔案用途：以標準函式庫驗證公開內容與可攜性。所在層：CI。主要關聯：scripts/check.py、tests/test_bundle.py。
name: Check skills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # runner 既有 Python 足以執行標準函式庫檢查，避免為文字套件額外安裝 runtime。
      - run: python3 --version
      - run: python3 scripts/check.py
      - run: python3 -m unittest discover -s tests -v
